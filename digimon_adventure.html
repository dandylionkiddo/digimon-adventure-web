<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>디지몬 어드벤처</title>
  <style>
    :root {
      --bg: #0a0e1a;
      --panel: #12182b;
      --accent: #ff6b1a;
      --accent2: #3b82f6;
      --text: #e8eef7;
      --muted: #8b9bb4;
      --success: #22c55e;
      --danger: #ef4444;
      --border: #1e2a44;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      line-height: 1.5;
    }

    #app {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    header {
      text-align: center;
      padding: 8px 0;
    }

    header h1 {
      font-size: 1.6rem;
      color: var(--accent);
      letter-spacing: 0.05em;
    }

    header p {
      color: var(--muted);
      font-size: 0.85rem;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
    }

    #story {
      min-height: 140px;
      white-space: pre-wrap;
      font-size: 0.95rem;
    }

    .highlight { color: var(--accent); font-weight: 600; }
    .enemy-name { color: var(--danger); }
    .ally-name { color: var(--success); }

    #status {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      font-size: 0.85rem;
    }

    .stat-block h3 {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .hp-bar {
      height: 10px;
      background: #1a2338;
      border-radius: 5px;
      overflow: hidden;
      margin-top: 4px;
    }

    .hp-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--success), #86efac);
      transition: width 0.3s ease;
    }

    .hp-fill.low { background: linear-gradient(90deg, var(--danger), #fca5a5); }

    #battle-area {
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .battle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .digimon-card {
      flex: 1;
      text-align: center;
      background: #0d1324;
      border-radius: 10px;
      padding: 10px;
      border: 1px solid var(--border);
    }

    .digimon-card img {
      width: 96px;
      height: 96px;
      object-fit: contain;
      image-rendering: auto;
      background: #0a0e1a;
      border-radius: 8px;
    }

    .digimon-card .name {
      font-weight: 600;
      margin-top: 6px;
      font-size: 0.9rem;
    }

    .digimon-card .stage {
      color: var(--muted);
      font-size: 0.75rem;
    }

    #actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    button {
      background: var(--accent2);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 0.9rem;
      cursor: pointer;
      font-family: inherit;
      transition: transform 0.1s, opacity 0.2s;
    }

    button:hover { opacity: 0.9; }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    button.primary { background: var(--accent); }
    button.danger { background: var(--danger); }
    button.success { background: var(--success); }

    #log {
      max-height: 120px;
      overflow-y: auto;
      font-size: 0.8rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      padding-top: 8px;
      margin-top: 4px;
    }

    .crest-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }

    .crest {
      background: #1a2338;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.75rem;
    }

    .crest.owned { border-color: var(--accent); color: var(--accent); }

    @media (max-width: 500px) {
      .battle-row { flex-direction: column; }
      #status { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>디지몬 어드벤처</h1>
      <p>1999 · 선택지와 전투로 이어가는 어드벤처</p>
    </header>

    <div class="panel" id="story">로딩 중...</div>

    <div class="panel" id="status">
      <div class="stat-block">
        <h3>파트너</h3>
        <div id="partner-info">-</div>
        <div class="hp-bar"><div class="hp-fill" id="partner-hp" style="width:100%"></div></div>
      </div>
      <div class="stat-block">
        <h3>문장</h3>
        <div class="crest-list" id="crests"></div>
      </div>
    </div>

    <div class="panel" id="battle-area">
      <div class="battle-row">
        <div class="digimon-card" id="ally-card">
          <img id="ally-img" src="" alt="">
          <div class="name" id="ally-name">-</div>
          <div class="stage" id="ally-stage">-</div>
          <div class="hp-bar"><div class="hp-fill" id="ally-hp-bar" style="width:100%"></div></div>
        </div>
        <div style="font-size:1.4rem;color:var(--muted)">VS</div>
        <div class="digimon-card" id="enemy-card">
          <img id="enemy-img" src="" alt="">
          <div class="name enemy-name" id="enemy-name">-</div>
          <div class="stage" id="enemy-stage">-</div>
          <div class="hp-bar"><div class="hp-fill low" id="enemy-hp-bar" style="width:100%"></div></div>
        </div>
      </div>
      <div id="log"></div>
    </div>

    <div id="actions"></div>
  </div>

  <script>
    // ========== 이미지 URL (공식 digimon.net 도감) ==========
    const IMG = {
      Agumon: "https://digimon.net/cimages/digimon/agumon.jpg",
      Greymon: "https://digimon.net/cimages/digimon/greymon.jpg",
      MetalGreymon: "https://digimon.net/cimages/digimon/metalgreymon.jpg",
      WarGreymon: "https://digimon.net/cimages/digimon/wargreymon.jpg",
      Gabumon: "https://digimon.net/cimages/digimon/gabumon.jpg",
      Garurumon: "https://digimon.net/cimages/digimon/garurumon.jpg",
      WereGarurumon: "https://digimon.net/cimages/digimon/weregarurumon.jpg",
      MetalGarurumon: "https://digimon.net/cimages/digimon/metalgarurumon.jpg",
      Biyomon: "https://digimon.net/cimages/digimon/biyomon.jpg",
      Birdramon: "https://digimon.net/cimages/digimon/birdramon.jpg",
      Garudamon: "https://digimon.net/cimages/digimon/garudamon.jpg",
      Tentomon: "https://digimon.net/cimages/digimon/tentomon.jpg",
      Kabuterimon: "https://digimon.net/cimages/digimon/kabuterimon.jpg",
      MegaKabuterimon: "https://digimon.net/cimages/digimon/megakabuterimon.jpg",
      Palmon: "https://digimon.net/cimages/digimon/palmon.jpg",
      Togemon: "https://digimon.net/cimages/digimon/togemon.jpg",
      Lillymon: "https://digimon.net/cimages/digimon/lillymon.jpg",
      Gomamon: "https://digimon.net/cimages/digimon/gomamon.jpg",
      Ikkakumon: "https://digimon.net/cimages/digimon/ikkakumon.jpg",
      Zudomon: "https://digimon.net/cimages/digimon/zudomon.jpg",
      Patamon: "https://digimon.net/cimages/digimon/patamon.jpg",
      Angemon: "https://digimon.net/cimages/digimon/angemon.jpg",
      MagnaAngemon: "https://digimon.net/cimages/digimon/magnaangemon.jpg",
      Gatomon: "https://digimon.net/cimages/digimon/gatomon.jpg",
      Angewomon: "https://digimon.net/cimages/digimon/angewomon.jpg",
      Devimon: "https://digimon.net/cimages/digimon/devimon.jpg",
      Etemon: "https://digimon.net/cimages/digimon/etemon.jpg",
      Myotismon: "https://digimon.net/cimages/digimon/myotismon.jpg",
      VenomMyotismon: "https://digimon.net/cimages/digimon/venommyotismon.jpg",
      MetalSeadramon: "https://digimon.net/cimages/digimon/metalseadramon.jpg",
      Puppetmon: "https://digimon.net/cimages/digimon/puppetmon.jpg",
      Machinedramon: "https://digimon.net/cimages/digimon/machinedramon.jpg",
      Piedmon: "https://digimon.net/cimages/digimon/piedmon.jpg",
      Apocalymon: "https://digimon.net/cimages/digimon/apocalymon.jpg",
      Kuwagamon: "https://digimon.net/cimages/digimon/kuwagamon.jpg",
      Shellmon: "https://digimon.net/cimages/digimon/shellmon.jpg",
      Seadramon: "https://digimon.net/cimages/digimon/seadramon.jpg",
      Unimon: "https://digimon.net/cimages/digimon/unimon.jpg",
      Meramon: "https://digimon.net/cimages/digimon/meramon.jpg",
      Andromon: "https://digimon.net/cimages/digimon/andromon.jpg",
      Monzaemon: "https://digimon.net/cimages/digimon/monzaemon.jpg",
      Centarumon: "https://digimon.net/cimages/digimon/centarumon.jpg",
      Leomon: "https://digimon.net/cimages/digimon/leomon.jpg",
      Ogremon: "https://digimon.net/cimages/digimon/ogremon.jpg",
      Gizamon: "https://digimon.net/cimages/digimon/gizamon.jpg",
      Digitamamon: "https://digimon.net/cimages/digimon/digitamamon.jpg",
      Wizardmon: "https://digimon.net/cimages/digimon/wizardmon.jpg",
      Gatomon_evil: "https://digimon.net/cimages/digimon/gatomon.jpg",
      default: "https://digimon.net/cimages/digimon/agumon.jpg",
    };

    // ========== 데이터 ==========
    const CRESTS = ["용기", "우정", "사랑", "지식", "성실", "희망", "빛", "기적"];

    const EVOLUTIONS = {
      Agumon: [
        { name: "Greymon", stage: "성숙기", hp: 180, atk: 45, req: null },
        { name: "MetalGreymon", stage: "완전체", hp: 280, atk: 70, req: "용기" },
        { name: "WarGreymon", stage: "궁극체", hp: 400, atk: 100, req: "용기" }
      ],
      Gabumon: [
        { name: "Garurumon", stage: "성숙기", hp: 170, atk: 42, req: null },
        { name: "WereGarurumon", stage: "완전체", hp: 270, atk: 68, req: "우정" },
        { name: "MetalGarurumon", stage: "궁극체", hp: 390, atk: 98, req: "우정" }
      ]
    };

    // ========== 게임 상태 ==========
    const game = {
      chapter: 0,
      partner: { name: "Agumon", stage: "성장기", hp: 100, maxHp: 100, atk: 25 },
      crests: new Set(),
      inBattle: false,
      enemy: null,
      log: []
    };

    // ========== UI 헬퍼 ==========
    function setStory(text) {
      document.getElementById("story").innerHTML = text;
    }

    function clearActions() {
      document.getElementById("actions").innerHTML = "";
    }

    function addButton(label, onClick, cls = "") {
      const btn = document.createElement("button");
      btn.textContent = label;
      if (cls) btn.className = cls;
      btn.onclick = onClick;
      document.getElementById("actions").appendChild(btn);
    }

    function updateStatus() {
      const p = game.partner;
      document.getElementById("partner-info").textContent =
        `${p.name} (${p.stage})  HP ${p.hp}/${p.maxHp}  ATK ${p.atk}`;
      const pct = Math.max(0, (p.hp / p.maxHp) * 100);
      const bar = document.getElementById("partner-hp");
      bar.style.width = pct + "%";
      bar.classList.toggle("low", pct < 30);

      const crestEl = document.getElementById("crests");
      crestEl.innerHTML = "";
      CRESTS.forEach(c => {
        const span = document.createElement("span");
        span.className = "crest" + (game.crests.has(c) ? " owned" : "");
        span.textContent = c;
        crestEl.appendChild(span);
      });
    }

    function showBattle(show) {
      document.getElementById("battle-area").style.display = show ? "flex" : "none";
      game.inBattle = show;
    }

    function logMsg(msg) {
      game.log.push(msg);
      if (game.log.length > 8) game.log.shift();
      document.getElementById("log").innerHTML = game.log.join("<br>");
    }

    function updateBattleUI() {
      const a = game.partner;
      const e = game.enemy;
      document.getElementById("ally-img").src = IMG[a.name] || IMG.default;
      document.getElementById("ally-name").textContent = a.name;
      document.getElementById("ally-stage").textContent = a.stage;
      const ap = Math.max(0, (a.hp / a.maxHp) * 100);
      document.getElementById("ally-hp-bar").style.width = ap + "%";
      document.getElementById("ally-hp-bar").classList.toggle("low", ap < 30);

      document.getElementById("enemy-img").src = IMG[e.name] || IMG.default;
      document.getElementById("enemy-name").textContent = e.name;
      document.getElementById("enemy-stage").textContent = e.stage || "";
      const ep = Math.max(0, (e.hp / e.maxHp) * 100);
      document.getElementById("enemy-hp-bar").style.width = ep + "%";
    }

    // ========== 전투 ==========
    function startBattle(enemy, onWin) {
      game.enemy = { ...enemy, maxHp: enemy.hp };
      game.log = [];
      showBattle(true);
      updateBattleUI();
      logMsg(`${enemy.name}이(가) 나타났다!`);
      clearActions();
      addButton("공격", () => playerAttack(onWin), "primary");
      addButton("진화 시도", () => tryEvolve(onWin));
      if (game.crests.size > 0) {
        addButton("문장 사용", () => useCrest(onWin), "success");
      }
    }

    function playerAttack(onWin) {
      if (!game.inBattle) return;
      const dmg = game.partner.atk + Math.floor(Math.random() * 10);
      game.enemy.hp -= dmg;
      logMsg(`${game.partner.name}의 공격! ${dmg} 데미지`);
      updateBattleUI();
      if (game.enemy.hp <= 0) {
        logMsg(`${game.enemy.name}을(를) 쓰러뜨렸다!`);
        endBattle(true, onWin);
        return;
      }
      enemyTurn(onWin);
    }

    function enemyTurn(onWin) {
      const dmg = game.enemy.atk + Math.floor(Math.random() * 8);
      game.partner.hp = Math.max(0, game.partner.hp - dmg);
      logMsg(`${game.enemy.name}의 공격! ${dmg} 데미지`);
      updateStatus();
      updateBattleUI();
      if (game.partner.hp <= 0) {
        logMsg("파트너가 쓰러졌다...");
        endBattle(false, onWin);
      }
    }

    function tryEvolve(onWin) {
      const evoList = EVOLUTIONS[game.partner.name] || EVOLUTIONS.Agumon;
      let next = null;
      for (const e of evoList) {
        if (e.name === game.partner.name) continue;
        if (e.req && !game.crests.has(e.req)) continue;
        const stages = ["성장기", "성숙기", "완전체", "궁극체"];
        const curIdx = stages.indexOf(game.partner.stage);
        const nextIdx = stages.indexOf(e.stage);
        if (nextIdx === curIdx + 1) {
          next = e;
          break;
        }
      }
      if (!next) {
        for (const e of evoList) {
          if (e.name !== game.partner.name && (!e.req || game.crests.has(e.req))) {
            next = e;
            break;
          }
        }
      }
      if (!next) {
        logMsg("지금은 진화할 수 없다...");
        return;
      }
      game.partner.name = next.name;
      game.partner.stage = next.stage;
      game.partner.maxHp = next.hp;
      game.partner.hp = next.hp;
      game.partner.atk = next.atk;
      logMsg(`진화! ${next.name}(${next.stage})로 진화했다!`);
      updateStatus();
      updateBattleUI();
    }

    function useCrest(onWin) {
      if (game.crests.size === 0) return;
      const heal = 40 + Math.floor(Math.random() * 20);
      game.partner.hp = Math.min(game.partner.maxHp, game.partner.hp + heal);
      logMsg(`문장의 힘으로 HP ${heal} 회복!`);
      updateStatus();
      updateBattleUI();
      enemyTurn(onWin);
    }

    function endBattle(won, onWin) {
      game.inBattle = false;
      clearActions();
      if (won) {
        addButton("계속", () => {
          showBattle(false);
          onWin && onWin();
        }, "primary");
      } else {
        setStory(`전투에서 패배했다...\n\n다시 도전하려면 페이지를 새로고침하세요.`);
        addButton("처음부터 다시", () => location.reload(), "primary");
      }
    }

    // ========== 스토리 챕터 ==========
    const chapters = [
      () => {
        setStory(`여름 캠프장. 하늘에서 이상한 장치가 떨어진다.\n\n태일, 아구몬과 함께 디지털 월드로 향한다.\n\n<span class=\"highlight\">파일섬</span>에 도착했다.`);
        clearActions();
        addButton("섬을 탐색한다", () => {
          game.chapter = 1;
          runChapter();
        }, "primary");
      },

      () => {
        setStory(`숲을 걷던 중 거대한 곤충 디지몬이 나타난다.\n\n<span class=\"enemy-name\">쿠와가몬</span>이 공격해 온다!`);
        clearActions();
        addButton("전투 시작", () => {
          startBattle(
            { name: "Kuwagamon", stage: "성숙기", hp: 90, atk: 20 },
            () => {
              setStory(`쿠와가몬을 물리쳤다!\n\n아구몬이 성장의 기운을 느낀다.`);
              clearActions();
              addButton("계속 전진", () => { game.chapter = 2; runChapter(); }, "primary");
            }
          );
        }, "primary");
      },

      () => {
        setStory(`해변에서 <span class=\"enemy-name\">쉘몬</span>이 나타난다.`);
        clearActions();
        addButton("전투 시작", () => {
          startBattle(
            { name: "Shellmon", stage: "성숙기", hp: 110, atk: 22 },
            () => {
              setStory(`쉘몬을 쓰러뜨렸다. 바다 쪽으로 나아가자 <span class=\"enemy-name\">시드라몬</span>이 나타난다!`);
              clearActions();
              addButton("시드라몬과 전투", () => {
                startBattle(
                  { name: "Seadramon", stage: "성숙기", hp: 120, atk: 25 },
                  () => {
                    setStory(`시드라몬도 물리쳤다. 섬 중앙의 산으로 향한다.`);
                    clearActions();
                    addButton("산으로 이동", () => { game.chapter = 3; runChapter(); }, "primary");
                  }
                );
              }, "primary");
            }
          );
        }, "primary");
      },

      () => {
        setStory(`화산 지대. <span class=\"enemy-name\">메라몬</span>이 길을 막는다.`);
        clearActions();
        addButton("전투 시작", () => {
          startBattle(
            { name: "Meramon", stage: "성숙기", hp: 130, atk: 28 },
            () => {
              setStory(`메라몬을 물리쳤다. 공장 유적에서 <span class=\"enemy-name\">안드로몬</span>이 폭주한다.`);
              clearActions();
              addButton("안드로몬과 전투", () => {
                startBattle(
                  { name: "Andromon", stage: "완전체", hp: 160, atk: 32 },
                  () => {
                    game.crests.add("용기");
                    updateStatus();
                    setStory(`안드로몬을 진정시켰다.\n\n<span class=\"highlight\">>>> 용기의 문장을 손에 넣었다!</span>`);
                    clearActions();
                    addButton("다음으로", () => { game.chapter = 4; runChapter(); }, "primary");
                  }
                );
              }, "primary");
            }
          );
        }, "primary");
      },

      () => {
        setStory(`파일섬의 어둠. <span class=\"enemy-name\">데비몬</span>이 아이들을 노린다.\n\n아구몬이 진화할 준비가 되어 있다.`);
        game.partner = { name: "Greymon", stage: "성숙기", hp: 180, maxHp: 180, atk: 45 };
        updateStatus();
        clearActions();
        addButton("그레이몬으로 진화 & 전투", () => {
          startBattle(
            { name: "Devimon", stage: "성숙기", hp: 200, atk: 40 },
            () => {
              setStory(`데비몬을 물리쳤다! 파일섬의 어둠이 걷힌다.\n\n서버 대륙으로 향한다.`);
              clearActions();
              addButton("서버 대륙으로", () => { game.chapter = 5; runChapter(); }, "primary");
            }
          );
        }, "primary");
      },

      () => {
        setStory(`서버 대륙. 독재자 <span class=\"enemy-name\">에테몬</span>이 네트워크를 장악하고 있다.\n\n<span class=\"highlight\">>>> 우정의 문장을 찾았다!</span>`);
        game.crests.add("우정");
        updateStatus();
        clearActions();
        addButton("에테몬과 전투", () => {
          startBattle(
            { name: "Etemon", stage: "완전체", hp: 250, atk: 50 },
            () => {
              game.partner = { name: "MetalGreymon", stage: "완전체", hp: 280, maxHp: 280, atk: 70 };
              updateStatus();
              setStory(`에테몬을 쓰러뜨렸다!\n\n메탈그레이몬으로 진화!`);
              clearActions();
              addButton("현실 세계로", () => { game.chapter = 6; runChapter(); }, "primary");
            }
          );
        }, "primary");
      },

      () => {
        setStory(`현실 세계. 밤의 지배자 <span class=\"enemy-name\">묘티스몬</span>이 아이들을 쫓는다.\n\n<span class=\"highlight\">>>> 빛의 문장을 얻었다!</span>`);
        game.crests.add("빛");
        updateStatus();
        clearActions();
        addButton("묘티스몬과 전투", () => {
          startBattle(
            { name: "Myotismon", stage: "완전체", hp: 300, atk: 55 },
            () => {
              setStory(`묘티스몬이 <span class=\"enemy-name\">베놈묘티스몬</span>으로 진화한다!`);
              clearActions();
              addButton("베놈묘티스몬과 전투", () => {
                startBattle(
                  { name: "VenomMyotismon", stage: "궁극체", hp: 380, atk: 70 },
                  () => {
                    setStory(`베놈묘티스몬을 물리쳤다! 디지털 월드로 다시 돌아간다.`);
                    clearActions();
                    addButton("다크 마스터즈로", () => { game.chapter = 7; runChapter(); }, "primary");
                  }
                );
              }, "primary");
            }
          );
        }, "primary");
      },

      () => {
        setStory(`다크 마스터즈가 디지털 월드를 지배하고 있다.\n\n메탈시드라몬, 퍼펫몬, 머쉰드라몬, 피에드몬... 하나씩 쓰러뜨려야 한다.`);
        const bosses = [
          { name: "MetalSeadramon", stage: "궁극체", hp: 320, atk: 65 },
          { name: "Puppetmon", stage: "궁극체", hp: 300, atk: 60 },
          { name: "Machinedramon", stage: "궁극체", hp: 350, atk: 75 },
          { name: "Piedmon", stage: "궁극체", hp: 360, atk: 80 }
        ];
        let i = 0;
        function nextBoss() {
          if (i >= bosses.length) {
            game.partner = { name: "WarGreymon", stage: "궁극체", hp: 400, maxHp: 400, atk: 100 };
            updateStatus();
            setStory(`모든 다크 마스터즈를 물리쳤다!\n\n<span class=\"highlight\">>>> 용기의 힘으로 워그레이몬으로 진화!</span>`);
            clearActions();
            addButton("최종 보스에게", () => { game.chapter = 8; runChapter(); }, "primary");
            return;
          }
          const b = bosses[i++];
          setStory(`>>> <span class=\"enemy-name\">${b.name}</span>과의 전투!`);
          clearActions();
          addButton("전투 시작", () => {
            startBattle(b, () => {
              setStory(`${b.name}을(를) 물리쳤다!`);
              clearActions();
              addButton("다음", nextBoss, "primary");
            });
          }, "primary");
        }
        clearActions();
        addButton("다크 마스터즈 도전", nextBoss, "primary");
      },

      () => {
        setStory(`모든 악의 집합체. <span class=\"enemy-name\">아포칼립몬</span>이 나타난다.\n\n아이들의 희망과 우정, 용기가 하나 된다.`);
        clearActions();
        addButton("최종 전투", () => {
          startBattle(
            { name: "Apocalymon", stage: "궁극체", hp: 500, atk: 90 },
            () => {
              setStory(`<span class=\"highlight\">아포칼립몬을 물리쳤다!</span>\n\n디지털 월드에 평화가 찾아온다.\n\n태일과 ${game.partner.name} (${game.partner.stage})\n\n<span class=\"highlight\">디지몬 어드벤처 - CLEAR!</span>\n\n원작의 핵심은 아이들이 각자의 약점과 감정을\n마주하며 성장하는 모습입니다.\n플레이해 주셔서 감사합니다!`);
              clearActions();
              addButton("처음부터 다시 하기", () => location.reload(), "primary");
            }
          );
        }, "primary");
      }
    ];

    function runChapter() {
      updateStatus();
      if (chapters[game.chapter]) chapters[game.chapter]();
    }

    function startGame() {
      updateStatus();
      runChapter();
    }

    startGame();
  </script>
</body>
</html>
