<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"/><title>디지몬 어드벤처</title></head>
<body>
<p id="m" style="font-family:sans-serif;text-align:center;margin-top:30vh">게임 로딩 중...</p>
<script>
const N = 8;
const BASE = "https://raw.githubusercontent.com/dandylionkiddo/digimon-adventure-web/main/chunks/";
async function load() {
  const parts = [];
  for (let i = 0; i < N; i++) {
    const r = await fetch(BASE + "part" + i + ".txt");
    if (!r.ok) throw new Error("chunk " + i + " failed");
    parts.push(await r.text());
  }
  const html = parts.join("");
  document.open();
  document.write(html);
  document.close();
}
load().catch(e => { document.getElementById("m").textContent = "로드 실패: " + e; });
</script>
</body>
</html>
