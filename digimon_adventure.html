<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>디지몬 어드벤처</title>
  <style>
    :root {
      --bg: #0a0e1a;
      --panel: #12182b;
      --accent: #ff6b1a;
      --accent2: #3b82f6;
      --text: #e8eef7;
      --muted: #8b9bb4;
      --success: #22c55e;
      --danger: #ef4444;
      --border: #1e2a44;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Pretendard", "Noto Sans KR", -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      background-image:
        radial-gradient(ellipse at 20% 0%, rgba(59,130,246,0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 100%, rgba(255,107,26,0.12) 0%, transparent 50%);
    }
    #app { width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 14px; }
    header.game-header { text-align: center; padding: 16px 0 4px; }
    header.game-header h1 {
      font-size: 1.85rem; letter-spacing: 0.06em;
      background: linear-gradient(90deg, #ff6b1a, #3b82f6);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    header.game-header p { color: var(--muted); font-size: 0.88rem; margin-top: 4px; }
    #status {
      background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
      padding: 14px 16px; display: grid; grid-template-columns: auto 1fr auto;
      gap: 12px 16px; align-items: center;
    }
    #st-partner-img {
      width: 64px; height: 64px; object-fit: contain; border-radius: 12px;
      background: #0f1525; border: 1px solid var(--border);
    }
    #status .label { color: var(--muted); font-size: 0.72rem; margin-bottom: 2px; }
    #status .value { font-weight: 600; font-size: 0.92rem; }
    .hp-bar { height: 11px; background: #1a2338; border-radius: 6px; overflow: hidden; margin-top: 6px; }
    .hp-fill { height: 100%; background: linear-gradient(90deg, #22c55e, #4ade80); border-radius: 6px; transition: width 0.35s ease; }
    .hp-fill.low { background: linear-gradient(90deg, #ef4444, #f87171); }
    .stat-side { text-align: right; min-width: 110px; }
    .stat-pill {
      display: inline-block; background: #1a2338; border: 1px solid var(--border);
      border-radius: 8px; padding: 4px 10px; font-size: 0.8rem; margin-top: 4px;
    }
    .stat-pill.heal { border-color: var(--success); color: #86efac; }
    .crest-list { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; margin-top: 6px; }
    .crest { background: #1a2338; border: 1px solid var(--border); border-radius: 6px; padding: 2px 7px; font-size: 0.7rem; }
    .crest.owned { border-color: var(--accent); color: var(--accent); }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; }
    #story { min-height: 110px; white-space: pre-wrap; font-size: 0.95rem; line-height: 1.65; }
    #story .chapter-title { display: block; color: var(--accent); font-weight: 700; margin-bottom: 8px; font-size: 1.05rem; }
    .highlight { color: var(--accent); font-weight: 600; }
    .enemy-name { color: var(--danger); font-weight: 600; }
    #battle-area { display: none; flex-direction: column; gap: 12px; }
    .battle-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .digimon-card {
      flex: 1; text-align: center; background: #0d1324; border-radius: 14px;
      padding: 14px 10px; border: 1px solid var(--border);
    }
    .digimon-card.ally { border-color: rgba(34,197,94,0.35); }
    .digimon-card.enemy { border-color: rgba(239,68,68,0.35); }
    .digimon-card img { width: 112px; height: 112px; object-fit: contain; background: #0a0e1a; border-radius: 10px; }
    .digimon-card .name { font-weight: 700; margin-top: 8px; font-size: 0.95rem; }
    .digimon-card .stage { color: var(--muted); font-size: 0.75rem; margin-top: 2px; }
    .vs-badge { font-size: 1.1rem; font-weight: 800; color: var(--muted); }
    #log {
      max-height: 96px; overflow-y: auto; font-size: 0.8rem; color: var(--muted);
      border-top: 1px solid var(--border); padding-top: 8px; line-height: 1.5;
    }
    #actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    button {
      background: var(--accent2); color: white; border: none; border-radius: 10px;
      padding: 12px 18px; font-size: 0.9rem; cursor: pointer; font-family: inherit;
      font-weight: 600; transition: transform 0.1s, opacity 0.2s, box-shadow 0.2s;
    }
    button:hover { opacity: 0.93; }
    button:active { transform: scale(0.97); }
    button.primary { background: linear-gradient(135deg, #ff6b1a, #f59e0b); box-shadow: 0 4px 14px rgba(255,107,26,0.25); }
    button.success { background: linear-gradient(135deg, #16a34a, #22c55e); box-shadow: 0 4px 14px rgba(34,197,94,0.2); }
    button.evolve { background: linear-gradient(135deg, #2563eb, #7c3aed); box-shadow: 0 4px 14px rgba(59,130,246,0.2); }
    button:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
    @media (max-width: 520px) {
      .battle-row { flex-direction: column; }
      #status { grid-template-columns: auto 1fr; }
      .stat-side { grid-column: 1 / -1; text-align: left; }
      .crest-list { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <div id="app">
    <header class="game-header">
      <h1>디지몬 어드벤처</h1>
      <p>1999 · 선택지와 전투로 이어가는 어드벤처</p>
    </header>
    <div id="status">
      <img id="st-partner-img" src="https://digimon.net/cimages/digimon/agumon.jpg" alt="">
      <div>
        <div class="label">파트너</div>
        <div class="value" id="st-partner">Agumon (성장기)</div>
        <div class="hp-bar"><div class="hp-fill" id="st-hp" style="width:100%"></div></div>
      </div>
      <div class="stat-side">
        <div class="label">회복 아이템</div>
        <div class="stat-pill heal" id="st-potions">💊 × 3</div>
        <div class="label" style="margin-top:8px">문장</div>
        <div class="crest-list" id="st-crests"></div>
      </div>
    </div>
    <div class="panel" id="story">로딩 중...</div>
    <div class="panel" id="battle-area">
      <div class="battle-row">
        <div class="digimon-card ally">
          <img id="ally-img" src="" alt="">
          <div class="name" id="ally-name">-</div>
          <div class="stage" id="ally-stage">-</div>
          <div class="hp-bar"><div class="hp-fill" id="ally-hp" style="width:100%"></div></div>
        </div>
        <div class="vs-badge">VS</div>
        <div class="digimon-card enemy">
          <img id="enemy-img" src="" alt="">
          <div class="name enemy-name" id="enemy-name">-</div>
          <div class="stage" id="enemy-stage">-</div>
          <div class="hp-bar"><div class="hp-fill low" id="enemy-hp" style="width:100%"></div></div>
        </div>
      </div>
      <div id="log"></div>
    </div>
    <div id="actions"></div>
  </div>
  <script>
    const IMG = {
      Agumon: "https://digimon.net/cimages/digimon/agumon.jpg",
      Greymon: "https://digimon.net/cimages/digimon/greymon.jpg",
      MetalGreymon: "https://digimon.net/cimages/digimon/metalgreymon.jpg",
      WarGreymon: "https://digimon.net/cimages/digimon/wargreymon.jpg",
      Devimon: "https://digimon.net/cimages/digimon/devimon.jpg",
      Etemon: "https://digimon.net/cimages/digimon/etemon.jpg",
      Myotismon: "https://digimon.net/cimages/digimon/myotismon.jpg",
      VenomMyotismon: "https://digimon.net/cimages/digimon/venommyotismon.jpg",
      MetalSeadramon: "https://digimon.net/cimages/digimon/metalseadramon.jpg",
      Puppetmon: "https://digimon.net/cimages/digimon/puppetmon.jpg",
      Machinedramon: "https://digimon.net/cimages/digimon/machinedramon.jpg",
      Piedmon: "https://digimon.net/cimages/digimon/piedmon.jpg",
      Apocalymon: "https://digimon.net/cimages/digimon/apocalymon.jpg",
      Kuwagamon: "https://digimon.net/cimages/digimon/kuwagamon.jpg",
      Shellmon: "https://digimon.net/cimages/digimon/shellmon.jpg",
      Seadramon: "https://digimon.net/cimages/digimon/seadramon.jpg",
      Meramon: "https://digimon.net/cimages/digimon/meramon.jpg",
      Andromon: "https://digimon.net/cimages/digimon/andromon.jpg",
      default: "https://digimon.net/cimages/digimon/agumon.jpg"
    };
    const CRESTS = ["용기", "우정", "사랑", "지식", "성실", "희망", "빛", "기적"];
    const EVOLUTIONS = {
      Agumon: [
        { name: "Greymon", stage: "성숙기", hp: 180, atk: 45 },
        { name: "MetalGreymon", stage: "완전체", hp: 280, atk: 70, req: "용기" },
        { name: "WarGreymon", stage: "궁극체", hp: 400, atk: 100, req: "용기" }
      ]
    };
    const game = {
      chapter: 0,
      partner: { name: "Agumon", stage: "성장기", hp: 100, maxHp: 100, atk: 25 },
      crests: new Set(),
      inBattle: false,
      enemy: null,
      log: [],
      potions: 3
    };
    function setStory(html) { document.getElementById("story").innerHTML = html; }
    function clearActions() { document.getElementById("actions").innerHTML = ""; }
    function addButton(label, fn, cls) {
      const b = document.createElement("button");
      b.textContent = label;
      if (cls) b.className = cls;
      b.onclick = fn;
      document.getElementById("actions").appendChild(b);
      return b;
    }
    function updateStatus() {
      const p = game.partner;
      document.getElementById("st-partner").textContent = p.name + " (" + p.stage + ")  HP " + p.hp + "/" + p.maxHp;
      document.getElementById("st-partner-img").src = IMG[p.name] || IMG.default;
      const pct = Math.max(0, (p.hp / p.maxHp) * 100);
      const bar = document.getElementById("st-hp");
      bar.style.width = pct + "%";
      bar.classList.toggle("low", pct < 30);
      document.getElementById("st-potions").textContent = "💊 × " + game.potions;
      const el = document.getElementById("st-crests");
      el.innerHTML = "";
      CRESTS.forEach(c => {
        const s = document.createElement("span");
        s.className = "crest" + (game.crests.has(c) ? " owned" : "");
        s.textContent = c;
        el.appendChild(s);
      });
    }
    function showBattle(show) {
      document.getElementById("battle-area").style.display = show ? "flex" : "none";
      game.inBattle = show;
    }
    function logMsg(m) {
      game.log.push(m);
      if (game.log.length > 8) game.log.shift();
      document.getElementById("log").innerHTML = game.log.join("<br>");
    }
    function updateBattleUI() {
      const a = game.partner, e = game.enemy;
      document.getElementById("ally-img").src = IMG[a.name] || IMG.default;
      document.getElementById("ally-name").textContent = a.name;
      document.getElementById("ally-stage").textContent = a.stage;
      document.getElementById("ally-hp").style.width = Math.max(0, a.hp / a.maxHp * 100) + "%";
      document.getElementById("ally-hp").classList.toggle("low", a.hp / a.maxHp < 0.3);
      document.getElementById("enemy-img").src = IMG[e.name] || IMG.default;
      document.getElementById("enemy-name").textContent = e.name;
      document.getElementById("enemy-stage").textContent = e.stage || "";
      document.getElementById("enemy-hp").style.width = Math.max(0, e.hp / e.maxHp * 100) + "%";
    }
    function renderBattleButtons(onWin) {
      clearActions();
      addButton("⚔️ 공격", () => playerAttack(onWin), "primary");
      addButton("✨ 진화 시도", () => tryEvolve(), "evolve");
      const healBtn = addButton("💚 회복하기 (" + game.potions + ")", () => useHeal(onWin), "success");
      if (game.potions <= 0) healBtn.disabled = true;
      if (game.crests.size) addButton("🏅 문장 사용", () => useCrest(onWin), "success");
    }
    function startBattle(enemy, onWin) {
      game.enemy = Object.assign({}, enemy, { maxHp: enemy.hp });
      game.log = [];
      showBattle(true);
      updateBattleUI();
      logMsg(enemy.name + "이(가) 나타났다!");
      renderBattleButtons(onWin);
    }
    function playerAttack(onWin) {
      if (!game.inBattle) return;
      const dmg = game.partner.atk + Math.floor(Math.random() * 10);
      game.enemy.hp -= dmg;
      logMsg(game.partner.name + "의 공격! " + dmg + " 데미지");
      updateBattleUI();
      if (game.enemy.hp <= 0) {
        logMsg(game.enemy.name + "을(를) 쓰러뜨렸다!");
        endBattle(true, onWin);
        return;
      }
      enemyTurn(onWin);
    }
    function enemyTurn(onWin) {
      const dmg = game.enemy.atk + Math.floor(Math.random() * 8);
      game.partner.hp = Math.max(0, game.partner.hp - dmg);
      logMsg(game.enemy.name + "의 공격! " + dmg + " 데미지");
      updateStatus();
      updateBattleUI();
      if (game.partner.hp <= 0) {
        logMsg("파트너가 쓰러졌다...");
        endBattle(false, onWin);
      }
    }
    function tryEvolve() {
      const list = EVOLUTIONS.Agumon;
      const stages = ["성장기", "성숙기", "완전체", "궁극체"];
      const cur = stages.indexOf(game.partner.stage);
      let next = null;
      for (const e of list) {
        if (stages.indexOf(e.stage) === cur + 1) {
          if (e.req && !game.crests.has(e.req)) { logMsg("문장이 부족해 진화할 수 없다."); return; }
          next = e; break;
        }
      }
      if (!next) { logMsg("지금은 진화할 수 없다..."); return; }
      game.partner = { name: next.name, stage: next.stage, hp: next.hp, maxHp: next.hp, atk: next.atk };
      logMsg("진화! " + next.name + "(" + next.stage + ")로 진화했다!");
      updateStatus();
      updateBattleUI();
    }
    function useHeal(onWin) {
      if (game.potions <= 0) { logMsg("회복 아이템이 없다..."); return; }
      game.potions -= 1;
      const heal = 50 + Math.floor(Math.random() * 30);
      game.partner.hp = Math.min(game.partner.maxHp, game.partner.hp + heal);
      logMsg("💚 회복하기! HP " + heal + " 회복 (남은 횟수: " + game.potions + ")");
      updateStatus();
      updateBattleUI();
      renderBattleButtons(onWin);
      enemyTurn(onWin);
    }
    function useCrest(onWin) {
      if (!game.crests.size) { logMsg("가진 문장이 없다."); return; }
      const heal = 40 + Math.floor(Math.random() * 20);
      game.partner.hp = Math.min(game.partner.maxHp, game.partner.hp + heal);
      logMsg("🏅 문장의 힘으로 HP " + heal + " 회복!");
      updateStatus();
      updateBattleUI();
      enemyTurn(onWin);
    }
    function endBattle(won, onWin) {
      game.inBattle = false;
      clearActions();
      if (won) {
        addButton("계속", () => { showBattle(false); onWin && onWin(); }, "primary");
      } else {
        setStory("<span class=\"chapter-title\">게임 오버</span>전투에서 패배했다.\n다시 도전하려면 페이지를 새로고침하세요.");
        addButton("처음부터 다시", () => location.reload(), "primary");
      }
    }
    const chapters = [
      () => {
        setStory("<span class=\"chapter-title\">프롤로그</span>여름 캠프장. 하늘에서 이상한 장치가 떨어진다.\n\n태일, 아구몬과 함께 디지털 월드로 향한다.\n\n<span class=\"highlight\">파일섬</span>에 도착했다.");
        clearActions();
        addButton("섬을 탐색한다", () => { game.chapter = 1; runChapter(); }, "primary");
      },
      () => {
        setStory("<span class=\"chapter-title\">파일섬 · 숲</span>거대한 곤충 디지몬이 나타난다.\n\n<span class=\"enemy-name\">쿠와가몬</span>이 공격해 온다!");
        clearActions();
        addButton("전투 시작", () => startBattle({ name: "Kuwagamon", stage: "성숙기", hp: 90, atk: 20 }, () => {
          setStory("쿠와가몬을 물리쳤다!\n아구몬이 성장의 기운을 느낀다.");
          clearActions();
          addButton("계속 전진", () => { game.chapter = 2; runChapter(); }, "primary");
        }), "primary");
      },
      () => {
        setStory("<span class=\"chapter-title\">파일섬 · 해변</span><span class=\"enemy-name\">쉘몬</span>이 나타난다.");
        clearActions();
        addButton("전투 시작", () => startBattle({ name: "Shellmon", stage: "성숙기", hp: 110, atk: 22 }, () => {
          setStory("쉘몬을 쓰러뜨렸다. <span class=\"enemy-name\">시드라몬</span>이 나타난다!");
          clearActions();
          addButton("시드라몬과 전투", () => startBattle({ name: "Seadramon", stage: "성숙기", hp: 120, atk: 25 }, () => {
            setStory("시드라몬도 물리쳤다. 섬 중앙의 산으로 향한다.");
            clearActions();
            addButton("산으로 이동", () => { game.chapter = 3; runChapter(); }, "primary");
          }), "primary");
        }), "primary");
      },
      () => {
        setStory("<span class=\"chapter-title\">파일섬 · 화산</span><span class=\"enemy-name\">메라몬</span>이 길을 막는다.");
        clearActions();
        addButton("전투 시작", () => startBattle({ name: "Meramon", stage: "성숙기", hp: 130, atk: 28 }, () => {
          setStory("메라몬을 물리쳤다. 공장에서 <span class=\"enemy-name\">안드로몬</span>이 폭주한다.");
          clearActions();
          addButton("안드로몬과 전투", () => startBattle({ name: "Andromon", stage: "완전체", hp: 160, atk: 32 }, () => {
            game.crests.add("용기"); game.potions += 2; updateStatus();
            setStory("안드로몬을 진정시켰다.\n<span class=\"highlight\">>>> 용기의 문장을 손에 넣었다!</span>\n(회복 아이템 +2)");
            clearActions();
            addButton("다음으로", () => { game.chapter = 4; runChapter(); }, "primary");
          }), "primary");
        }), "primary");
      },
      () => {
        setStory("<span class=\"chapter-title\">파일섬 · 어둠</span><span class=\"enemy-name\">데비몬</span>이 아이들을 노린다.\n아구몬이 진화할 준비가 되어 있다.");
        game.partner = { name: "Greymon", stage: "성숙기", hp: 180, maxHp: 180, atk: 45 };
        updateStatus();
        clearActions();
        addButton("그레이몬으로 전투", () => startBattle({ name: "Devimon", stage: "성숙기", hp: 200, atk: 40 }, () => {
          setStory("데비몬을 물리쳤다! 파일섬의 어둠이 걷힌다.\n서버 대륙으로 향한다.");
          clearActions();
          addButton("서버 대륙으로", () => { game.chapter = 5; runChapter(); }, "primary");
        }), "primary");
      },
      () => {
        setStory("<span class=\"chapter-title\">서버 대륙</span>독재자 <span class=\"enemy-name\">에테몬</span>이 네트워크를 장악하고 있다.\n<span class=\"highlight\">>>> 우정의 문장을 찾았다!</span>");
        game.crests.add("우정"); game.potions += 2; updateStatus();
        clearActions();
        addButton("에테몬과 전투", () => startBattle({ name: "Etemon", stage: "완전체", hp: 250, atk: 50 }, () => {
          game.partner = { name: "MetalGreymon", stage: "완전체", hp: 280, maxHp: 280, atk: 70 };
          updateStatus();
          setStory("에테몬을 쓰러뜨렸다!\n메탈그레이몬으로 진화!");
          clearActions();
          addButton("현실 세계로", () => { game.chapter = 6; runChapter(); }, "primary");
        }), "primary");
      },
      () => {
        setStory("<span class=\"chapter-title\">현실 세계</span>밤의 지배자 <span class=\"enemy-name\">묘티스몬</span>.\n<span class=\"highlight\">>>> 빛의 문장을 얻었다!</span>");
        game.crests.add("빛"); game.potions += 2; updateStatus();
        clearActions();
        addButton("묘티스몬과 전투", () => startBattle({ name: "Myotismon", stage: "완전체", hp: 300, atk: 55 }, () => {
          setStory("묘티스몬이 <span class=\"enemy-name\">베놈묘티스몬</span>으로 진화한다!");
          clearActions();
          addButton("베놈묘티스몬과 전투", () => startBattle({ name: "VenomMyotismon", stage: "궁극체", hp: 380, atk: 70 }, () => {
            setStory("베놈묘티스몬을 물리쳤다! 디지털 월드로 돌아간다.");
            clearActions();
            addButton("다크 마스터즈로", () => { game.chapter = 7; runChapter(); }, "primary");
          }), "primary");
        }), "primary");
      },
      () => {
        setStory("<span class=\"chapter-title\">다크 마스터즈</span>메탈시드라몬, 퍼펫몬, 머쉰드라몬, 피에드몬...\n하나씩 쓰러뜨려야 한다.");
        const bosses = [
          { name: "MetalSeadramon", stage: "궁극체", hp: 320, atk: 65 },
          { name: "Puppetmon", stage: "궁극체", hp: 300, atk: 60 },
          { name: "Machinedramon", stage: "궁극체", hp: 350, atk: 75 },
          { name: "Piedmon", stage: "궁극체", hp: 360, atk: 80 }
        ];
        let i = 0;
        function nextBoss() {
          if (i >= bosses.length) {
            game.partner = { name: "WarGreymon", stage: "궁극체", hp: 400, maxHp: 400, atk: 100 };
            updateStatus();
            setStory("모든 다크 마스터즈를 물리쳤다!\n<span class=\"highlight\">>>> 워그레이몬으로 진화!</span>");
            clearActions();
            addButton("최종 보스에게", () => { game.chapter = 8; runChapter(); }, "primary");
            return;
          }
          const b = bosses[i++];
          setStory(">>> <span class=\"enemy-name\">" + b.name + "</span>과의 전투!");
          clearActions();
          addButton("전투 시작", () => startBattle(b, () => {
            setStory(b.name + "을(를) 물리쳤다!");
            clearActions();
            addButton("다음", nextBoss, "primary");
          }), "primary");
        }
        clearActions();
        addButton("다크 마스터즈 도전", nextBoss, "primary");
      },
      () => {
        setStory("<span class=\"chapter-title\">최종 결전</span>모든 악의 집합체. <span class=\"enemy-name\">아포칼립몬</span>이 나타난다.\n아이들의 희망과 우정, 용기가 하나 된다.");
        clearActions();
        addButton("최종 전투", () => startBattle({ name: "Apocalymon", stage: "궁극체", hp: 500, atk: 90 }, () => {
          setStory("<span class=\"highlight\">아포칼립몬을 물리쳤다!</span>\n\n디지털 월드에 평화가 찾아온다.\n태일과 " + game.partner.name + " (" + game.partner.stage + ")\n\n<span class=\"highlight\">디지몬 어드벤처 - CLEAR!</span>\n\n플레이해 주셔서 감사합니다!");
          clearActions();
          addButton("처음부터 다시 하기", () => location.reload(), "primary");
        }), "primary");
      }
    ];
    function runChapter() { updateStatus(); if (chapters[game.chapter]) chapters[game.chapter](); }
    function startGame() { updateStatus(); runChapter(); }
    startGame();
  </script>
</body>
</html>
