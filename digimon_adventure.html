<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>디지몬 어드벤처</title></head>
<body>
<p id="m" style="font-family:sans-serif;text-align:center;margin-top:30vh;color:#666">게임 로딩 중...</p>
<script>
(async () => {
  const base = "https://raw.githubusercontent.com/dandylionkiddo/digimon-adventure-web/main/parts/";
  let b64 = "";
  for (let i = 0; i < 4; i++) {
    const r = await fetch(base + "c" + i + ".b64");
    if (!r.ok) throw new Error("c" + i + ": " + r.status);
    b64 += (await r.text()).replace(/\s/g, "");
  }
  while (b64.length % 4) b64 += "=";
  const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const ds = new DecompressionStream("gzip");
  const stream = new Blob([bin]).stream().pipeThrough(ds);
  const html = await new Response(stream).text();
  document.open();
  document.write(html);
  document.close();
})().catch(e => {
  document.getElementById("m").innerHTML = "로드 실패: " + e;
});
</script>
</body>
</html>
